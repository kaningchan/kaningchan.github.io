name: Deploy VitePress site to GitHub Pages

on:
  # Deploy whenever code is pushed to main
  push:
    branches:
      - main

  # Allow manual deployment from the Actions page
  workflow_dispatch:

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent multiple Pages deployments from running at the same time
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build VitePress
    runs-on: ubuntu-latest

    steps:
      # Download the repository source code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Install Node.js and enable npm dependency caching
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Configure the GitHub Pages environment
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Install the exact dependency versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Build the VitePress website
      - name: Build VitePress site
        run: npm run docs:build

      # Upload the generated static website
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Publish the uploaded artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4